<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>経験値トラッカー</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f3f2ee;
    --surface-1: #fcfcfb;
    --border: #e2e0d8;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7a7974;
    --grid: #ecebe5;
    --series-1: #2a78d6;
    --accent-bg: #e8f0fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #111110;
      --surface-1: #1a1a19;
      --border: #2e2d2a;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8f8e86;
      --grid: #2a2a27;
      --series-1: #3987e5;
      --accent-bg: #1c2a3d;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2d2a;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --grid: #2a2a27; --series-1: #3987e5; --accent-bg: #1c2a3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--surface-0); color: var(--text-primary);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; }
  .updated { color: var(--text-muted); font-size: 13px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .char-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .char-name { font-size: 18px; font-weight: 700; }
  .lv { font-size: 15px; color: var(--text-secondary); }
  .stale { font-size: 12px; color: #b3261e; }
  .hero { display: flex; align-items: baseline; gap: 6px; margin: 4px 0 6px; }
  .hero .num { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
  .hero .unit { font-size: 18px; color: var(--text-secondary); }
  .bar { height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
  .bar > div { height: 100%; background: var(--series-1); border-radius: 4px; }
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
  @media (min-width: 640px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .stat .label { font-size: 12px; color: var(--text-muted); }
  .stat .value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat.key .value { font-size: 18px; }
  .stat .sub { font-size: 11px; color: var(--text-muted); }
  .stat.key { background: var(--accent-bg); border-radius: 8px; padding: 6px 10px; }
  .chart-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin: 16px 0 8px; }
  .chart-head h2 { font-size: 15px; margin: 0; }
  .ranges { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .ranges button {
    border: 0; background: transparent; color: var(--text-secondary); font: inherit; font-size: 13px;
    padding: 6px 12px; cursor: pointer; min-height: 32px;
  }
  .ranges button[aria-pressed="true"] { background: var(--accent-bg); color: var(--text-primary); font-weight: 600; }
  .chart-box { position: relative; height: 240px; }
  .note { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  details { margin-top: 10px; }
  summary { cursor: pointer; font-size: 13px; color: var(--text-secondary); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 6px; }
  th, td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  .ss { margin: 16px 0 0; }
  .ss img { display: block; width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--border); cursor: zoom-in; }
  .ss figcaption { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; align-items: center; justify-content: center; z-index: 10; overflow: auto; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: none; width: auto; height: auto; max-height: 100vh; cursor: zoom-out; }
  @media (max-width: 640px) { .lightbox { align-items: flex-start; justify-content: flex-start; } .lightbox img { max-height: none; } }
  h3.sec { font-size: 15px; margin: 18px 0 8px; }
  .box-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; margin-top: 8px; }
  .box-form label { font-size: 12px; color: var(--text-muted); display: block; }
  .box-form input { width: 100%; font: inherit; font-size: 16px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-0); color: var(--text-primary); }
  .box-form button { grid-column: 1 / -1; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--accent-bg); color: var(--text-primary); cursor: pointer; min-height: 40px; }
  .box-form .saved { grid-column: 1 / -1; font-size: 12px; color: var(--text-muted); }
  .msg { color: var(--text-secondary); padding: 24px 0; text-align: center; }
</style>
</head>

const HOUR = 3600 * 1000, DAY = 24 * HOUR;
const OFF_GAP = 12 * HOUR;
// Weekly maintenance (Wednesday 10:00-15:00 JST): a gap between two records that overlaps it
// is left out entirely (from the last record before to the first record after the maintenance).
const MAINT = { dow: 3, from: 10, to: 15 };
function maintMs(a, b) {
  if (b <= a) return 0;
  const J = 9 * HOUR;                         // JST = UTC+9
  let total = 0;
  let day = Math.floor((a + J) / DAY) * DAY;  // JST midnight of a (as a shifted timestamp)
  for (; day <= b + J; day += DAY) {
    if (new Date(day).getUTCDay() !== MAINT.dow) continue;
    const s = day - J + MAINT.from * HOUR, e = day - J + MAINT.to * HOUR;
    total += Math.max(0, Math.min(b, e) - Math.max(a, s));
  }
  return total > 0 ? b - a : 0;
}
const RANGES = { "24時間": DAY, "7日": 7 * DAY, "30日": 30 * DAY };

// パンドラの箱: defaults until set on the page (from the spreadsheet: 148 s/box, 6倍 = 889,333,368 per box)

// The box EXP values above were measured with the 100% EXP scroll (経験値呪文書).
// A scroll adds to the server rate: 100% = +1x (6x event + 100% scroll = 7x).
// So other scrolls scale them by (rate + scroll/100) / (rate + 1).
const BOX_BASE_SCROLL = 100;
const scrollFactor = (s, r) => {
  const rt = Number(r) || 1;
  return (rt + (Number(s) || 0) / 100) / (rt + BOX_BASE_SCROLL / 100);
};

08400000,17.4375],[1789819200000,17.5312],[1789830000000,17.625],[1789840800000,17.7188],[1789851600000,17.8125],[1789862400000,17.9062],[1789873200000,18.0],[1789884000000,18.1143],[1789894800000,18.2286],[1789905600000,18.3429],[1789916400000,18.4572],[1789927200000,18.5715],[1789938000000,18.6858],[1789948800000,18.8001],[1789959600000,18.9144],[1789970400000,19.0287],[1789981200000,19.143],[1789992000000,19.2573],[1790002800000,19.3716],[1790013600000,19.4859],[1790024400000,19.6002],[1790035200000,19.7145],[1790046000000,19.8288],[1790056800000,19.9431],[1790067600000,20.0574],[1790078400000,20.1717],[1790089200000,20.286],[1790100000000,20.4003],[1790110800000,20.5146],[1790121600000,20.6289],[1790132400000,20.7432],[1790143200000,20.8576],[1790154000000,20.9719],[1790164800000,21.0862],[1790175600000,21.2005],[1790186400000,21.3148],[1790197200000,21.4291],[1790208000000,21.5434],[1790218800000,21.6577],[1790229600000,21.772],[1790240400000,21.8863],[1790251200000,22.0006],[1790262000000,22.1149],[1790272800000,22.2292],[1790283600000,22.3435],[1790294400000,22.4578],[1790305200000,22.5721],[1790316000000,22.6864],[1790326800000,22.8007],[1790337600000,22.915],[1790348400000,23.0293],[1790359200000,23.1436],[1790370000000,23.2579],[1790380800000,23.3722],[1790391600000,23.4865],[1790402400000,23.6008],[1790413200000,23.7151],[1790424000000,23.8294],[1790434800000,23.9437],[1790445600000,24.058],[1790456400000,24.1723],[1790467200000,24.2866],[1790478000000,24.4009],[1790488800000,24.5152],[1790499600000,24.6295],[1790510400000,24.7438],[1790521200000,24.8581],[1790532000000,24.9724],[1790542800000,25.0867],[1790553600000,25.201],[1790564400000,25.3153],[1790575200000,25.4296],[1790586000000,25.5439],[1790596800000,25.6582],[1790607600000,25.7725],[1790618400000,25.8868],[1790629200000,26.0011],[1790640000000,26.1154],[1790650800000,26.2297],[1790661600000,26.344],[1790672400000,26.4583],[1790683200000,26.5727],[1790694000000,26.687],[1790704800000,26.8013],[1790715600000,26.9156],[1790726400000,27.0299],[1790737200000,27.1137],[1790748000000,27.1823],[1790758800000,27.2508],[1790769600000,27.3194],[1790780400000,27.388],[1790791200000,27.4566],[1790802000000,27.5252],[1790812800000,27.5937],[1790823600000,27.6623],[1790834400000,27.7309],[1790845200000,27.7995],[1790856000000,27.8681],[1790866800000,27.9367],[1790877600000,28.0052],[1790888400000,28.0738],[1790899200000,28.1424],[1790910000000,28.211],[1790920800000,28.2796],[1790931600000,28.3481],[1790942400000,28.4167],[1790953200000,28.4853],[1790964000000,28.5539],[1790974800000,28.6225],[1790985600000,28.691],[1790996400000,28.7596],[1791007200000,28.8282],[1791018000000,28.8968],[1791028800000,28.9654],[1791039600000,29.034],[1791050400000,29.1025],[1791061200000,29.1711],[1791072000000,29.2397],[1791082800000,29.3083],[1791093600000,29.3769],[1791104400000,29.4454],[1791115200000,29.514],[1791126000000,29.5826],[1791136800000,29.6512],[1791147600000,29.7198],[1791158400000,29.7883],[1791169200000,29.8569],[1791180000000,29.9255],[1791190800000,29.9941],[1791201600000,30.0695],[1791212400000,30.149],[1791223200000,30.2286],[1791234000000,30.3081],[1791242400000,30.37]] } };
function estFor(id, log) {
  const h = EST_HISTORY[id];
  if (!h) return [];
  const first = log.length ? log[0].t : Infinity;
  return h.pts.filter(([tt]) => tt < first)
    .map(([tt, p]) => ({ t: tt, lv: h.lv, next: h.next, cur: Math.round(h.next * p / 100), est: true }));
}
const rateKey = r => String(r || 1).replace(".", "_");

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtInt = n => Number(n).toLocaleString("ja-JP");
const fmtTime = t => {
  const d = new Date(t);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
};
const pctOf = e => e.cur / e.next * 100;
const fmtJp = n => n >= 1e8 ? `${(n / 1e8).toFixed(1)}億` : n >= 1e4 ? `${(n / 1e4).toFixed(1)}万` : `${Math.round(n)}`;

// Drop OCR misreads: within a level, current EXP never goes down.
// A record lower than the one before, or higher than the one after (a spike), is ignored.
function dropMisreads(log) {
  const kept = [];
  log.forEach((e, i) => {
    const p = kept[kept.length - 1], n = log[i + 1];
    if (p && p.lv === e.lv && e.cur < p.cur) return;
    if (n && n.lv === e.lv && e.cur > n.cur && (!p || p.lv !== e.lv || n.cur >= p.cur)) return;
    kept.push(e);
  });
  return kept;
}

async function putJson(path, value) {
  const r = await fetch(`${DB}/${path}`, { method: "PUT", body: JSON.stringify(value) });
  if (!r.ok) throw new Error(`${r.status}`);
}

async function getJson(path) {
  const r = await fetch(`${DB}/${path}`, { cache: "no-store" });
  if (!r.ok) throw new Error(`${r.status}`);
  return r.json();
}

// Attack macro running segments sent by the PC ({s, e} in ms). When they exist,
// only the time inside them counts as running time (macro on + game open).
function runMsBetween(a, b, segs) {
  let ms = 0;
  for (const g of segs) ms += Math.max(0, Math.min(b, g.e) - Math.max(a, g.s));
  return ms;
}
// Running time for the pair of records p -> q when it is a "clean" attack interval, else null.
// With running segments: the macro ran at least 90% of the time between the two records
// (intervals with a restart, party setup or other non-attack time are left out).
// Older records: records at most RUN_GAP apart, no maintenance in between.
function cleanMs(p, q, segs) {
  const gap = q.t - p.t;
  if (gap <= 0 || gap > RUN_GAP || maintMs(p.t, q.t) > 0) return null;
  if (segs && segs.length && p.t >= segs[0].s - 5 * 60000) {
    const ms = runMsBetween(p.t, q.t, segs);
    return ms >= gap * 0.9 ? ms : null;
  }
  return gap;
}

// EXP gained per (running) hour, using the latest level only (a level-up resets current EXP)
function hourlyGain(log, latest, segs) {
  const same = log.filter(e => e.lv === latest.lv);
  for (const win of [DAY, 3 * DAY, 30 * DAY]) {
    const pts = same.filter(e => e.t >= latest.t - win);
    if (pts.length < 2) continue;
    // skip rest periods (no records for OFF_GAP or more, e.g. weeks without an EXP event)
    let gain = 0, ms = 0;
    for (let i = 1; i < pts.length; i++) {
      const m = cleanMs(pts[i - 1], pts[i], segs);
      if (m == null) continue;
      gain += pts[i].cur - pts[i - 1].cur; ms += m;
    }
    const hours = ms / HOUR;
    if (hours < 0.5) continue;
    return { perHour: gain / hours, hours };
  }
  return null;
}

// Macro running time per day: records arrive about every 30 min only while the
// attack macro runs, so gaps up to RUN_GAP count as running time.
const RUN_GAP = 45 * 60 * 1000;
// A gap of OFF_GAP or more is a rest period: left out of all rates and daily averages.
function runHoursPerDay(log, segs, perHour) {
  const now = Date.now();
  if (segs && segs.length) {
    // exact: running time from the PC; rest periods and maintenance are left out of the day
    const start = Math.max(now - 7 * DAY, segs[0].s);
    let run = runMsBetween(start, now, segs);
    // "attack-equivalent" time: EXP actually gained / EXP per clean attack hour.
    // Time the macro looked busy but gained (almost) nothing is not counted.
    if (perHour > 0) {
      const pts = log.filter(e => e.t >= start);
      let gain = 0;
      for (let i = 1; i < pts.length; i++) {
        const p = pts[i - 1], q = pts[i];
        if (p.lv !== q.lv || q.cur < p.cur) continue;
        if (q.t - p.t >= OFF_GAP || maintMs(p.t, q.t) > 0) continue;
        gain += q.cur - p.cur;
      }
      run = Math.min(run, gain / perHour * HOUR);
    }
    let off = 0;
    for (let i = 0; i < segs.length; i++) {
      const a = Math.max(start, segs[i].e), b = i + 1 < segs.length ? segs[i + 1].s : now;
      if (b <= a) continue;
      if (b - a >= OFF_GAP || maintMs(a, b) > 0) off += b - a;
    }
    const span = now - start - off;
    if (span < HOUR) return null;
    return { hours: Math.min(24, run / span * 24), days: span / DAY, exact: true };
  }
  const pts = log.filter(e => e.t >= now - 7 * DAY);
  if (pts.length < 2) return null;
  let run = 0, span = 0;
  for (let i = 1; i < pts.length; i++) {
    const gap = pts[i].t - pts[i - 1].t;
    if (gap >= OFF_GAP) continue;          // rest period: not counted at all
    span += gap - maintMs(pts[i - 1].t, pts[i].t);
    if (gap <= RUN_GAP) run += gap;
  }
  const tail = now - pts[pts.length - 1].t;
  if (tail < OFF_GAP) { span += tail - maintMs(now - tail, now); if (tail <= RUN_GAP) run += tail; }
  if (span < HOUR) return null;
  return { hours: run / span * 24, days: span / DAY };
}

// Server rate at the time of a record. Newer records carry it; older ones were 6x
// until the 10x apology bonus started on 10/7 (records between then and the first one with a rate are skipped).
const LEGACY_RATE_SWITCH = Date.parse("2026-10-07T15:00:00+09:00");
function rateAt(e, nowRate) { return e.rate || (e.t < LEGACY_RATE_SWITCH ? 6 : 0); }   // 0 = unknown: not used

function perBox(box, rv) {
  const base = Number((box.exp || {})[rateKey(rv)]) || 0;
  return base * scrollFactor(Number(box.scroll) || 0, rv);
}

// Measured box pace while the macro is running: EXP gained over running gaps
// (records <= RUN_GAP apart), turned into boxes with the box EXP at that time's rate.
function runPace(log, L, box, nowRate, segs) {
  const same = log.filter(e => e.lv === L.lv);
  for (const win of [DAY, 3 * DAY, 30 * DAY]) {
    const pts = same.filter(e => e.t >= L.t - win);
    let boxes = 0, ms = 0;
    for (let i = 1; i < pts.length; i++) {
      const m = cleanMs(pts[i - 1], pts[i], segs);
      if (m == null) continue;
      // only the current server rate: box EXP per rate is not exact, so rates are not mixed
      if (rateAt(pts[i], nowRate) !== nowRate || rateAt(pts[i - 1], nowRate) !== nowRate) continue;
      const per = perBox(box, nowRate);
      if (!per) continue;
      boxes += (pts[i].cur - pts[i - 1].cur) / per; ms += m;
    }
    if (ms >= HOUR / 2 && boxes > 0) return { sec: ms / 1000 / boxes, hours: ms / HOUR };
  }
  return null;
}

function boxStats(L, rate, box, gain, log, segs, run) {
  const setSec = Number(box.sec) || 0;
  const scroll = Number(box.scroll) || 0;
  const rv = (rate && rate.value) || 1;
  const base = Number((box.exp || {})[rateKey(rv)]) || 0;
  const per = perBox(box, rv);
  const pace = per ? runPace(log, L, box, rv, segs) : null;
  const sec = pace ? pace.sec : setSec;          // measured pace when available, else the setting
  const full = sec > 0 ? 86400 / sec : 0;
  const perDay = sec > 0 && run ? run.hours * 3600 / sec : 0;
  const dayPct = per && perDay ? per * perDay / L.next * 100 : null;
  const reachDays = per && perDay ? (L.next - L.cur) / (per * perDay) : null;
  return { sec, setSec, measured: !!pace, base, scroll, rv, per, perDay, full, run, dayPct, totalDays: dayPct ? 100 / dayPct : null, reachDays };
}

function render(chars, rate, box) {
  const root = document.getElementById("root");
  if (!chars.length) {
    root.innerHTML = '<div class="msg">まだデータがありません。PCからの最初の送信をお待ちください。</div>';
    return;
  }
  root.innerHTML = "";
  for (const c of chars) {
    const L = c.latest, pct = pctOf(L);
    const gain = hourlyGain(c.log, L, c.segs);
    const run = runHoursPerDay(c.log, c.segs, gain && gain.perHour);
    let gainTxt = "計測中", etaTxt = "計測中";
    if (gain) {
      gainTxt = gain.perHour > 0 ? `${fmtJp(gain.perHour)} / 時` : "増加なし";
      if (gain.perHour > 0) {
        // exact running time: EXP per running hour x running hours per day
        const perDay = run && run.exact ? gain.perHour * run.hours : gain.perHour * 24;
        const days = (L.next - L.cur) / perDay;
        etaTxt = days >= 1000 ? `${fmtInt(Math.round(days))} 日` : `${days.toFixed(1)} 日`;
      } else etaTxt = "—";
    }
    const rateTxt = rate && rate.value > 1 ? `${rate.value} 倍` : "通常（1倍）";
    const bx = boxStats(L, rate, box, gain, c.log, c.segs, run);
    const rateLabel = rate && rate.value > 1 ? `${rate.value}倍` : "1倍";
    const rateSub = rate && rate.value > 1 && rate.end ? `<div class="sub">${escapeHtml(rate.end)} まで</div>` : "";
    const stale = Date.now() - L.t > 2 * HOUR
      ? `<span class="stale">⚠ ${Math.floor((Date.now() - L.t) / HOUR)}時間 更新なし</span>` : "";

    const card = document.createElement("section");
    card.className = "card";
    card.innerHTML = `
      <div class="char-head">
        <span class="char-name">${escapeHtml(L.name || c.id)}</span>
        <span class="lv">Lv ${L.lv}</span>${stale}
      </div>
      <div class="hero"><span class="num">${pct.toFixed(3)}</span><span class="unit">%</span></div>
      <div class="bar"><div style="width:${Math.min(100, pct)}%"></div></div>
      <div class="stats">
        <div class="stat key"><div class="label">レベルアップまで（実測）</div><div class="value">${etaTxt}</div></div>
        <div class="stat"><div class="label">${run && run.exact ? "稼働1時間あたり" : "1時間あたり"}</div><div class="value">${gainTxt}</div></div>
        <div class="stat"><div class="label">経験値倍率</div><div class="value">${rateTxt}</div>${rateSub}</div>
        <div class="stat"><div class="label">現在経験値</div><div class="value">${fmtInt(L.cur)}</div></div>
        <div class="stat"><div class="label">次Lv経験値</div><div class="value">${fmtInt(L.next)}</div></div>
        <div class="stat"><div class="label">最終更新</div><div class="value">${fmtTime(L.t)}</div></div>
      </div>
      <h3 class="sec">パンドラの箱（${rateLabel}）</h3>
      <div class="stats">
        <div class="stat"><div class="label">箱あけペース${bx.measured ? "（実測）" : "（設定値）"}</div><div class="value">${bx.sec ? `${bx.sec.toFixed(bx.measured ? 1 : 0)} 秒毎` : "未設定"}</div>${bx.measured && bx.setSec ? `<div class="sub">設定 ${bx.setSec} 秒</div>` : ""}</div>
        <div class="stat"><div class="label">1日使用量</div><div class="value">${bx.perDay ? `${bx.perDay.toFixed(2)} 箱` : "計測中"}</div>${bx.run ? `<div class="sub">稼働 ${bx.run.hours.toFixed(1)} 時間/日（直近${bx.run.days < 1 ? `${Math.round(bx.run.days * 24)}時間` : `${bx.run.days.toFixed(1)}日`}）</div>` : ""}${bx.full ? `<div class="sub">24時間なら ${bx.full.toFixed(2)} 箱</div>` : ""}</div>
        <div class="stat"><div class="label">1日予想</div><div class="value">${bx.dayPct != null ? `${bx.dayPct.toFixed(2)} %` : "計測中"}</div></div>
        <div class="stat"><div class="label">次レベルまでの総日数</div><div class="value">${bx.totalDays != null ? `${Math.round(bx.totalDays)} 日` : "計測中"}</div><div class="sub">0%から100%まで</div></div>
        <div class="stat key"><div class="label">到達日数（箱の計算）</div><div class="value">${bx.reachDays != null ? `${bx.reachDays.toFixed(1)} 日` : "計測中"}</div>${bx.reachDays != null && bx.reachDays < 3650 ? `<div class="sub">${(d => `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`)(new Date(Date.now() + bx.reachDays * DAY))} ごろ（${rateLabel}のまま）</div>` : ""}</div>
        <div class="stat"><div class="label">箱1個の経験値</div><div class="value">${bx.per ? fmtInt(Math.round(bx.per)) : "未設定"}</div>${bx.per ? `<div class="sub">呪文書${bx.scroll}%＝${+(bx.rv + bx.scroll / 100).toFixed(2)}倍相当（×${scrollFactor(bx.scroll, bx.rv).toFixed(3)}）</div>` : ""}</div>
      </div>
      <details class="box-set"><summary>箱の設定を変える</summary>
        <form class="box-form">
          <div><label>箱あけ秒数（実測が出るまで使う値）</label><input name="sec" type="number" inputmode="decimal" step="any" min="1" value="${bx.setSec || ""}"></div>
          <div><label>箱1個の経験値（${rateLabel}・呪文書100%時）</label><input name="exp" type="number" inputmode="numeric" min="0" value="${bx.base || ""}"></div>
          <div><label>使っている経験値呪文書（%）</label><input name="scroll" type="number" inputmode="numeric" min="0" step="any" value="${bx.scroll}"></div>
          <button type="submit">保存</button>
          <div class="saved"></div>
        </form>
      </details>
      ${c.ss && c.ss.img ? `<figure class="ss"><img alt="ゲーム画面" src="data:image/jpeg;base64,${c.ss.img}"><figcaption>ゲーム画面 ${fmtTime(c.ss.t)} 撮影（タップで拡大）</figcaption></figure>` : ""}
      <div class="chart-head">
        <h2>経験値の推移（%）</h2>
        <div class="ranges" role="group" aria-label="期間">
          ${Object.keys(RANGES).map(k => `<button type="button" data-r="${k}" aria-pressed="${k === currentRange}">${k}</button>`).join("")}
        </div>
      </div>
      <div class="chart-box"><canvas aria-label="経験値の推移"></canvas></div>
      <div class="note">毎週水曜の定期メンテナンス（前後の記録の間まるごと）と、12時間以上の休みは計算から外しています。点線は記録を始める前の推定です（シートの記録とサーバー倍率から計算）。レベルが上がった時点で%は0に戻ります。予想日数は現在のレベルでの直近の稼ぎから計算しています。</div>
      <details><summary>記録の一覧（直近20件）</summary><div class="tbl"></div></details>`;
    root.appendChild(card);

    card.querySelectorAll(".ranges button").forEach(b => b.addEventListener("click", () => {
      currentRange = b.dataset.r;
      render(chars, rate, box);
    }));

    const img = card.querySelector(".ss img");
    if (img) img.addEventListener("click", () => {
      const lb = document.getElementById("lightbox");
      lb.querySelector("img").src = img.src;
      lb.classList.add("open");
    });
    card.querySelector(".box-form").addEventListener("submit", async ev => {
      ev.preventDefault();
      const f = ev.target, msg = f.querySelector(".saved");
      const sec = Number(f.sec.value), exp = Number(f.exp.value), scroll = Number(f.scroll.value);
      if (!(sec > 0) || !(exp >= 0)) { msg.textContent = "数字を入れてください"; return; }
      msg.textContent = "保存中…";
      try {
        await putJson("exp/_box/sec.json", sec);
        await putJson(`exp/_box/exp/${rateKey(rate && rate.value)}.json`, exp);
        await putJson("exp/_box/scroll.json", scroll >= 0 ? scroll : 0);
        box.scroll = scroll >= 0 ? scroll : 0;
        box.sec = sec; box.exp = { ...(box.exp || {}), [rateKey(rate && rate.value)]: exp };
        render(chars, rate, box);
      } catch (e) { msg.textContent = `保存できませんでした（${e.message}）`; }
    });

    const rows = c.log.slice(-20).reverse();
    card.querySelector(".tbl").innerHTML = `<table>
      <thead><tr><th>日時</th><th>Lv</th><th>%</th><th>現在経験値</th></tr></thead>
      <tbody>${rows.map(e => `<tr><td>${fmtTime(e.t)}</td><td>${e.lv}</td><td>${pctOf(e).toFixed(3)}</td><td>${fmtInt(e.cur)}</td></tr>`).join("")}</tbody>
    </table>`;

    drawChart(c.id, card.querySelector("canvas"), [...estFor(c.id, c.log), ...c.log]);
  }
}

function drawChart(id, canvas, log) {
  const from = Date.now() - RANGES[currentRange];
  const pts = log.filter(e => e.t >= from);
  // break the line at level-ups so the drop to 0% is not drawn as a slope
  const data = [];
  pts.forEach((e, i) => {
    if (i > 0 && e.lv !== pts[i - 1].lv) data.push({ x: e.t - 1, y: null });
    data.push({ x: e.t, y: +pctOf(e).toFixed(3), lv: e.lv, est: !!e.est });
  });
  if (charts[id]) charts[id].destroy();
  const series = css("--series-1"), grid = css("--grid"), muted = css("--text-muted"), surface = css("--surface-1");
  charts[id] = new Chart(canvas, {
    type: "line",
    data: { datasets: [{
      data, borderColor: series, backgroundColor: series, borderWidth: 2,
      pointRadius: data.length > 60 ? 0 : 3, pointHoverRadius: 5,
      pointBorderColor: surface, pointBorderWidth: 2, spanGaps: false, tension: 0,
      segment: { borderDash: ctx => ctx.p1.raw && ctx.p1.raw.est ? [5, 4] : undefined }
    }]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false, parsing: false,
      interaction: { mode: "nearest", axis: "x", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: items => fmtTime(items[0].parsed.x),
            label: item => `Lv ${item.raw.lv}  ${item.parsed.y.toFixed(3)}%${item.raw.est ? "（推定）" : ""}`
          }
        }
      },
      scales: {
        x: {
          type: "linear", min: from, max: Date.now(),
          grid: { color: grid }, border: { display: false },
          ticks: { color: muted, maxTicksLimit: 6, maxRotation: 0, callback: v => fmtTime(v) }
        },
        y: {
          grid: { color: grid }, border: { display: false },
          ticks: { color: muted, maxTicksLimit: 5, callback: v => `${v}%` }
        }
      }
    }
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

async function load() {
  try {
    const top = await getJson("exp.json?shallow=true") || {};
    const ids = Object.keys(top).filter(k => !k.startsWith("_"));
    const rate = await getJson("exp/_rate.json").catch(() => null);
    const saved = await getJson("exp/_box.json").catch(() => null) || {};
    const box = { sec: saved.sec ?? BOX_DEFAULT.sec, scroll: saved.scroll ?? BOX_DEFAULT.scroll, exp: { ...BOX_DEFAULT.exp, ...(saved.exp || {}) } };
    const chars = [];
    for (const id of ids) {
      const [latest, logObj, ss, runObj] = await Promise.all([
        getJson(`exp/${id}/latest.json`),
        getJson(`exp/${id}/log.json?orderBy="$key"&limitToLast=1500`),
        getJson(`exp/${id}/ss.json`).catch(() => null),
        getJson(`exp/${id}/run.json?orderBy="$key"&startAt="${Date.now() - 31 * DAY}"`).catch(() => null)
      ]);
      if (!latest) continue;
      const raw = Object.values(logObj || {})
        .filter(e => e && e.t && Number.isFinite(e.cur) && Number.isFinite(e.next) && e.next > 0)
        .sort((a, b) => a.t - b.t);
      const log = dropMisreads(raw);
      // if the latest reading itself was a misread, show the last good record instead
      let L = latest;
      if (log.length && !log.some(e => Math.abs(e.t - latest.t) < 60000 && e.cur === latest.cur))
        L = { ...log[log.length - 1], name: latest.name };
      const segs = Object.values(runObj || {})
        .filter(g => g && Number.isFinite(g.s) && Number.isFinite(g.e) && g.e >= g.s)
        .sort((a, b) => a.s - b.s);
      chars.push({ id, latest: L, log, ss, segs });
    }
    // keep an open settings form open across the 5-minute reload
    if (document.querySelector(".box-set[open]")) return;
    render(chars, rate, box);
    document.getElementById("updated").textContent = `表示更新 ${fmtTime(Date.now())}`;
  } catch (e) {
    document.getElementById("root").innerHTML =
      `<div class="msg">データを読み込めませんでした（${escapeHtml(e.message)}）。<br>Firebaseのルールに「exp」が追加されているか確認してください。</div>`;
  }
}

document.getElementById("lightbox").addEventListener("click", e => e.currentTarget.classList.remove("open"));
load();
setInterval(load, 5 * 60 * 1000);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", load);
</script>
</body>
</html>
