# Removes one PC from the "各PCのゲームメモリ" table (deletes exp/_pcs/<pc> in Firebase).
name: firebase-remove-pc
on:
  workflow_dispatch:
    inputs:
      pc:
        description: "PC name to remove (e.g. PC-1)"
        required: true
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete exp/_pcs/<pc>
        env:
          PC: ${{ inputs.pc }}
        run: |
          set -e
          case "$PC" in *[!A-Za-z0-9_-]*|"") echo "bad name"; exit 1;; esac
          curl -fsS -X DELETE "https://rock-pt-default-rtdb.firebaseio.com/exp/_pcs/$PC.json"
          echo "removed $PC"
